      \ b = true\n\ndef pruneRight [DecidableEq α] [DecidableEq β]\n    (relation\
      \ : α → β → Bool) (left : Finset α) (right : Finset β) : Finset β :=\n  right.filter\
      \ fun b => ∃ a ∈ left, relation a b = true\n\ndef Target : Prop := ∀ (α β :\
      \ Type) [DecidableEq α] [DecidableEq β]\n    (relation : α → β → Bool) left\
      \ right a b,\n  (a ∈ left → b ∈ right → relation a b = true →\n    a ∈ pruneLeft\
      \ relation left right ∧ b ∈ pruneRight relation left right) ∧\n  pruneLeft relation\
      \ left right ⊆ left ∧\n  pruneRight relation left right ⊆ right ∧\n  pruneLeft\
      \ relation (pruneLeft relation left right) right = pruneLeft relation left right\
