      \ Edge := edges.foldl toggle ∅\n\ndef xor (left right : Finset Edge) : Finset\
      \ Edge :=\n  (left \\ right) ∪ (right \\ left)\n\ndef Target : Prop := ∀ first\
      \ second edge,\n  boundary (first ++ second) = xor (boundary first) (boundary\
