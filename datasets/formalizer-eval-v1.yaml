- name: formalizer-eval/interval-abstract-interpretation
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\nstructure Interval where\n\
      \  lo : Int\n  hi : Int\n\ndef Interval.contains (i : Interval) (x : Int) :\
      \ Prop := i.lo ≤ x ∧ x ≤ i.hi\ndef Interval.add (a b : Interval) : Interval\
      \ := ⟨a.lo + b.lo, a.hi + b.hi⟩\ndef Interval.negate (a : Interval) : Interval\
      \ := ⟨-a.hi, -a.lo⟩\ndef Interval.multiply (a b : Interval) : Interval :=\n\
      \  let p := a.lo * b.lo\n  let q := a.lo * b.hi\n  let r := a.hi * b.lo\n  let\
      \ s := a.hi * b.hi\n  ⟨min (min p q) (min r s), max (max p q) (max r s)⟩\n\n\
      inductive Expr where\n  | constant : Int → Expr\n  | variable : Nat → Expr\n\
      \  | add : Expr → Expr → Expr\n  | multiply : Expr → Expr → Expr\n  | negate\
      \ : Expr → Expr\n\ndef Expr.eval (ρ : Nat → Int) : Expr → Int\n  | .constant\
      \ z => z\n  | .variable n => ρ n\n  | .add a b => a.eval ρ + b.eval ρ\n  | .multiply\
      \ a b => a.eval ρ * b.eval ρ\n  | .negate a => -a.eval ρ\n\ndef Expr.abstract\
      \ (ρ : Nat → Interval) : Expr → Interval\n  | .constant z => ⟨z, z⟩\n  | .variable\
      \ n => ρ n\n  | .add a b => (a.abstract ρ).add (b.abstract ρ)\n  | .multiply\
      \ a b => (a.abstract ρ).multiply (b.abstract ρ)\n  | .negate a => (a.abstract\
      \ ρ).negate\n\ndef Target : Prop :=\n  ∀ (expression : Expr) (concrete : Nat\
      \ → Int) (abstract : Nat → Interval),\n    (∀ n, (abstract n).contains (concrete\
      \ n)) →\n      (expression.abstract abstract).contains (expression.eval concrete)\n\
      \nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: abstract-interpretation
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: interval-abstract-interpretation
      license: Apache-2.0
      reference: null
- name: formalizer-eval/interval-union-insertion
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\nstructure Interval where\n\
      \  lower : Nat\n  upper : Nat\n  deriving DecidableEq\n\ndef Interval.contains\
      \ (interval : Interval) (point : Nat) : Bool :=\n  interval.lower ≤ point &&\
      \ point ≤ interval.upper\n\ndef merge (left right : Interval) : Interval :=\n\
      \  ⟨min left.lower right.lower, max left.upper right.upper⟩\n\ndef insertInterval\
      \ (incoming : Interval) : List Interval → List Interval\n  | [] => [incoming]\n\
      \  | current :: rest =>\n      if incoming.upper + 1 < current.lower then incoming\
      \ :: current :: rest\n      else if current.upper + 1 < incoming.lower then\
      \ current :: insertInterval incoming rest\n      else insertInterval (merge\
      \ incoming current) rest\n\ndef covered (intervals : List Interval) (point :\
      \ Nat) : Bool :=\n  intervals.any (fun interval => interval.contains point)\n\
      \ndef Canonical : List Interval → Prop\n  | [] => True\n  | [interval] => interval.lower\
      \ ≤ interval.upper\n  | first :: second :: rest =>\n      first.lower ≤ first.upper\
      \ ∧ first.upper + 1 < second.lower ∧ Canonical (second :: rest)\n\ndef Target\
      \ : Prop :=\n  ∀ incoming intervals point,\n    incoming.lower ≤ incoming.upper\
      \ → Canonical intervals →\n      covered (insertInterval incoming intervals)\
      \ point =\n        (incoming.contains point || covered intervals point) ∧\n\
      \      (insertInterval incoming intervals).length ≤ intervals.length + 1 ∧\n\
      \      Canonical (insertInterval incoming intervals) ∧\n      insertInterval\
      \ incoming (insertInterval incoming intervals) = insertInterval incoming intervals\n\
      \nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: canonical-interval-sets
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: interval-union-insertion
      license: Apache-2.0
