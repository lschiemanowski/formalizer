      \ :=\n  ⟨summary.count + 1, summary.sum + value,\n   some (summary.minimum.elim\
      \ value (min value)),\n   some (summary.maximum.elim value (max value))⟩\n\n\
      def summarize (values : List Int) : Summary := values.foldl add ⟨0, 0, none,\
      \ none⟩\n\ndef combine (left right : Summary) : Summary :=\n  ⟨left.count +\
      \ right.count, left.sum + right.sum,\n   match left.minimum, right.minimum with\n\
      \   | none, other | other, none => other\n   | some a, some b => some (min a\
      \ b),\n   match left.maximum, right.maximum with\n   | none, other | other,\
      \ none => other\n   | some a, some b => some (max a b)⟩\n\ndef Target : Prop\
      \ := ∀ values extra,\n  summarize (values ++ extra) = combine (summarize values)\
      \ (summarize extra) ∧\n  (summarize values).count = values.length ∧\n  (summarize\
      \ values).sum = values.sum ∧\n  ((summarize values).minimum = none ↔ values\
      \ = []) ∧\n  ((summarize values).maximum = none ↔ values = [])\n\nend FormalizerProblem\n"
