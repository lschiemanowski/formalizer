      \ right => left.flatten ++ right.flatten\n\ndef Tree.nodes : Tree → Nat\n  |\
      \ .leaf _ => 1\n  | .node left right => left.nodes + right.nodes\n\ndef Tree.sum\
      \ : Tree → Nat\n  | .leaf value => value\n  | .node left right => left.sum +\
