- name: formalizer-eval/retry-state-machine-accounting
  inputs:
    source: "import Mathlib\nnamespace FormalizerProblem\n\ninductive Outcome where\
      \ | success | transient | permanent deriving DecidableEq\n\nstructure State\
      \ where\n  attempts : Nat\n  completed : Bool\n  failed : Bool\n  deriving DecidableEq\n\
      \ndef step (limit : Nat) (state : State) (outcome : Outcome) : State :=\n  if\
      \ state.completed || state.failed then state else\n  match outcome with\n  |\
      \ .success => { state with attempts := state.attempts + 1, completed := true\
      \ }\n  | .permanent => { state with attempts := state.attempts + 1, failed :=\
      \ true }\n  | .transient =>\n      let attempts := state.attempts + 1\n    \
      \  { state with attempts, failed := limit ≤ attempts }\n\ndef run (limit : Nat)\
      \ (initial : State) (outcomes : List Outcome) : State :=\n  outcomes.foldl (step\
      \ limit) initial\n\ndef Terminal (state : State) : Prop := state.completed =\
      \ true ∨ state.failed = true\n\ndef Target : Prop := ∀ limit initial outcomes,\n\
      \  initial.attempts ≤ limit →\n  let final := run limit initial outcomes\n \
      \ (initial.completed = true → final = initial) ∧\n  final.attempts ≤ initial.attempts\
      \ + outcomes.length ∧\n  (final.completed = true → final.failed = initial.failed)\
      \ ∧\n  (limit ≤ final.attempts → Terminal final ∨ outcomes = []) ∧\n  (Terminal\
      \ final → run limit final outcomes = final)\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: fault-tolerant-request-retries
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: retry-state-machine-accounting
      license: Apache-2.0
