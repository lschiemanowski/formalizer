- name: formalizer-eval/balanced-delimiter-depth-parser
  inputs:
    source: "import Mathlib\nnamespace FormalizerProblem\ninductive Token where |\
      \ open | close | atom deriving DecidableEq\ndef step : Option Nat→Token→Option\
      \ Nat\n | none,_=>none | some depth,.open=>some (depth+1) | some 0,.close=>none\n\
      \ | some (depth+1),.close=>some depth | some depth,.atom=>some depth\ndef parse\
      \ (tokens : List Token) := tokens.foldl step (some 0)\ndef mirrorToken : Token→Token\
      \ | .open=>.close | .close=>.open | .atom=>.atom\ndef mirror (tokens : List\
      \ Token) := tokens.reverse.map mirrorToken\ndef Balanced (tokens : List Token)\
      \ := parse tokens=some 0\ndef Target : Prop := ∀ tokens extra,\n Balanced tokens→Balanced\
      \ (mirror tokens) ∧ mirror (mirror tokens)=tokens ∧\n (mirror tokens).length=tokens.length\
      \ ∧\n mirror (tokens++extra)=mirror extra++mirror tokens ∧\n (Balanced extra→Balanced\
      \ (tokens++extra))\nend FormalizerProblem"
  metadata:
