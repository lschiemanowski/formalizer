- name: formalizer-eval/dead-store-elimination-soundness
  inputs:
    source: "import Mathlib\nnamespace FormalizerProblem\n\ninductive Expr where\n\
      \  | literal : Int → Expr\n  | variable : Nat → Expr\n  | add : Expr → Expr\
      \ → Expr\n\ndef Expr.eval (store : Nat → Int) : Expr → Int\n  | .literal value\
      \ => value\n  | .variable name => store name\n  | .add left right => left.eval\
      \ store + right.eval store\n\ndef Expr.reads : Expr → Finset Nat\n  | .literal\
      \ _ => ∅\n  | .variable name => {name}\n  | .add left right => left.reads ∪\
      \ right.reads\n\nstructure Assign where\n  destination : Nat\n  expression :\
      \ Expr\n\ndef run : (Nat → Int) → List Assign → Nat → Int\n  | store, [] =>\
      \ store\n  | store, instruction :: rest =>\n      run (Function.update store\
      \ instruction.destination (instruction.expression.eval store)) rest\n\ndef liveBefore\
      \ : List Assign → Finset Nat → Finset Nat\n  | [], live => live\n  | instruction\
      \ :: rest, live =>\n      let needed := liveBefore rest live\n      if instruction.destination\
      \ ∈ needed then\n        (needed.erase instruction.destination) ∪ instruction.expression.reads\n\
      \      else needed\n\ndef eliminate : List Assign → Finset Nat → List Assign\n\
      \  | [], _ => []\n  | instruction :: rest, live =>\n      let needed := liveBefore\
      \ rest live\n      if instruction.destination ∈ needed then\n        instruction\
      \ :: eliminate rest live\n      else eliminate rest live\n\ndef AgreeOn (names\
      \ : Finset Nat) (left right : Nat → Int) : Prop :=\n  ∀ name ∈ names, left name\
