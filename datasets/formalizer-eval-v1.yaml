- name: formalizer-eval/vector-clock-merge-algebra
  inputs:
    source: "import Mathlib\nnamespace FormalizerProblem\nabbrev Clock (Node : Type)\
      \ := Node → Nat\ndef merge [DecidableEq Node] (left right : Clock Node) : Clock\
      \ Node := fun node => max (left node) (right node)\ndef advance [DecidableEq\
      \ Node] (node : Node) (clock : Clock Node) : Clock Node := fun other => if other=node\
      \ then clock other+1 else clock other\ndef leq (left right : Clock Node) : Prop\
      \ := ∀ node,left node≤right node\ndef Target : Prop := ∀ (Node : Type) [DecidableEq\
      \ Node] (first second third : Clock Node) node,\n merge first second=merge second\
      \ first ∧\n merge (merge first second) third=merge first (merge second third)\
      \ ∧\n merge first first=first ∧\n leq first (merge first second) ∧\n leq (merge\
      \ first second) (merge (advance node first) second)\nend FormalizerProblem"
