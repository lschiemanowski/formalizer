    source: "import Mathlib\nnamespace FormalizerProblem\n\nstructure Clearing where\n\
      \  fills : List Nat\n  buyRemainders : List Nat\n  sellRemainders : List Nat\n\
      \ndef clear : List Nat → List Nat → Clearing\n  | [], sells => ⟨[], [], sells⟩\n\
      \  | buys, [] => ⟨[], buys, []⟩\n  | buy :: buys, sell :: sells =>\n      let\
      \ rest := clear buys sells\n      let filled := min buy sell\n      ⟨filled\
