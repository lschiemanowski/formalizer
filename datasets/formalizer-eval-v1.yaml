- name: formalizer-eval/piece-table-split-preservation
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ninductive Buffer where\
      \ | original | added deriving DecidableEq\n\nstructure Piece where\n  buffer\
      \ : Buffer\n  offset : Nat\n  length : Nat\n  deriving DecidableEq\n\ndef Piece.render\
      \ (original added : List Char) (piece : Piece) : List Char :=\n  let source\
      \ := match piece.buffer with | .original => original | .added => added\n  (source.drop\
      \ piece.offset).take piece.length\n\ndef Piece.split (piece : Piece) (position\
      \ : Nat) : Piece × Piece :=\n  let firstLength := min position piece.length\n\
      \  (⟨piece.buffer, piece.offset, firstLength⟩,\n   ⟨piece.buffer, piece.offset\
      \ + firstLength, piece.length - firstLength⟩)\n\ndef Target : Prop :=\n  ∀ (original\
      \ added : List Char) (piece : Piece) (position : Nat),\n    let pieces := piece.split\
      \ position\n    pieces.1.render original added ++ pieces.2.render original added\
      \ =\n      piece.render original added ∧\n    pieces.1.length + pieces.2.length\
      \ = piece.length ∧\n    pieces.2.offset = piece.offset + pieces.1.length\n\n\
      end FormalizerProblem\n"
