- name: formalizer-eval/relational-equijoin-symmetry
  inputs:
    source: "import Mathlib\nnamespace FormalizerProblem\n\nstructure LeftRow (Key\
      \ Value : Type) where\n  key : Key\n  value : Value\n  deriving DecidableEq\n\
      structure RightRow (Key Value : Type) where\n  key : Key\n  value : Value\n\
      \  deriving DecidableEq\nstructure Joined (Key Left Right : Type) where\n  key\
      \ : Key\n  left : Left\n  right : Right\n  deriving DecidableEq\n\ndef join\
      \ [DecidableEq Key] (left : List (LeftRow Key A)) (right : List (RightRow Key\
      \ B)) :\n    List (Joined Key A B) :=\n  left.flatMap fun l => (right.filter\
      \ (fun r => r.key = l.key)).map fun r => ⟨l.key, l.value, r.value⟩\n\ndef swapRows\
      \ (rows : List (Joined Key A B)) : List (Joined Key B A) :=\n  rows.map fun\
      \ row => ⟨row.key, row.right, row.left⟩\n\ndef Target : Prop := ∀ (Key A B :\
      \ Type) [DecidableEq Key]\n    (left : List (LeftRow Key A)) (right : List (RightRow\
      \ Key B)) joined,\n  (joined ∈ join left right ↔\n    ∃ l ∈ left, ∃ r ∈ right,\
      \ l.key = r.key ∧ joined = ⟨l.key, l.value, r.value⟩) ∧\n  (join left right).length\
      \ ≤ left.length * right.length ∧\n  (swapRows (join left right)).Perm\n    (join\
      \ (right.map fun r => (⟨r.key, r.value⟩ : LeftRow Key B))\n      (left.map fun\
      \ l => (⟨l.key, l.value⟩ : RightRow Key A))) ∧\n  (∀ row ∈ join left right,\
      \ ∃ l ∈ left, row.key = l.key) ∧\n  (∀ row ∈ join left right, ∃ r ∈ right, row.key\
      \ = r.key)\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: relational-database-joins
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: relational-equijoin-symmetry
      license: Apache-2.0
      reference: null
- name: formalizer-eval/trie-compaction-correctness
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ninductive Trie (α :\
      \ Type) where\n  | empty : Trie α\n  | node : Option α → Trie α → Trie α → Trie\
      \ α\n  deriving DecidableEq\n\ndef Trie.lookup {α : Type} : List Bool → Trie\
      \ α → Option α\n  | _, .empty => none\n  | [], .node value _ _ => value\n  |\
      \ false :: key, .node _ left _ => lookup key left\n  | true :: key, .node _\
      \ _ right => lookup key right\n\ndef Trie.nodes {α : Type} : Trie α → Nat\n\
      \  | .empty => 0\n  | .node _ left right => 1 + left.nodes + right.nodes\n\n\
      def Trie.compact {α : Type} : Trie α → Trie α\n  | .empty => .empty\n  | .node\
      \ value left right =>\n      let left' := left.compact\n      let right' :=\
      \ right.compact\n      match value, left', right' with\n      | none, .empty,\
      \ .empty => .empty\n      | _, _, _ => .node value left' right'\n\ndef Target\
      \ : Prop :=\n  ∀ (α : Type) (trie : Trie α) (key : List Bool),\n    trie.compact.lookup\
      \ key = trie.lookup key ∧\n    trie.compact.compact = trie.compact ∧\n    trie.compact.nodes\
      \ ≤ trie.nodes\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: trie-garbage-collection
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: trie-compaction-correctness
      license: Apache-2.0
      reference: null
- name: formalizer-eval/bidirectional-typechecker-correctness
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ninductive Ty where |\
      \ nat | arrow : Ty → Ty → Ty deriving DecidableEq\ninductive Term where\n  |\
      \ var : Nat → Term\n  | numeral : Nat → Term\n  | app : Term → Term → Term\n\
      \  | lam : Ty → Term → Term\n\ninductive HasType : List Ty → Term → Ty → Prop\
      \ where\n  | var {context n ty} : context[n]? = some ty → HasType context (.var\
      \ n) ty\n  | numeral {context n} : HasType context (.numeral n) .nat\n  | app\
      \ {context f x a b} : HasType context f (.arrow a b) → HasType context x a →\n\
      \      HasType context (.app f x) b\n  | lam {context a body b} : HasType (a\
      \ :: context) body b →\n      HasType context (.lam a body) (.arrow a b)\n\n\
      def infer : List Ty → Term → Option Ty\n  | context, .var n => context[n]?\n\
      \  | _, .numeral _ => some .nat\n  | context, .app f x => do\n      let fTy\
      \ ← infer context f\n      let xTy ← infer context x\n      match fTy with\n\
      \      | .arrow a b => if xTy = a then some b else none\n      | .nat => none\n\
      \  | context, .lam a body => (infer (a :: context) body).map (.arrow a)\n\n\
      def Target : Prop :=\n  (∀ context term ty, infer context term = some ty ↔ HasType\
      \ context term ty) ∧\n  (∀ context term left right, HasType context term left\
      \ → HasType context term right → left = right)\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: typechecker-metatheory
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: bidirectional-typechecker-correctness
      license: Apache-2.0
      reference: null
- name: formalizer-eval/typed-language-substitution
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ninductive Ty where\n\
      \  | base : Ty\n  | arrow : Ty → Ty → Ty\n  deriving DecidableEq\n\ninductive\
      \ Term where\n  | var : Nat → Term\n  | app : Term → Term → Term\n  | lam :\
      \ Ty → Term → Term\n\ninductive HasType : List Ty → Term → Ty → Prop where\n\
      \  | var {context n ty} : context[n]? = some ty → HasType context (.var n) ty\n\
      \  | app {context function argument input output} :\n      HasType context function\
      \ (.arrow input output) → HasType context argument input →\n      HasType context\
      \ (.app function argument) output\n  | lam {context input body output} : HasType\
      \ (input :: context) body output →\n      HasType context (.lam input body)\
      \ (.arrow input output)\n\ndef shift : Nat → Nat → Term → Term\n  | cutoff,\
      \ amount, .var n => .var (if cutoff ≤ n then n + amount else n)\n  | cutoff,\
      \ amount, .app a b => .app (shift cutoff amount a) (shift cutoff amount b)\n\
      \  | cutoff, amount, .lam ty body => .lam ty (shift (cutoff + 1) amount body)\n\
      \ndef substitute : Nat → Term → Term → Term\n  | index, replacement, .var n\
      \ =>\n      if n = index then replacement else if index < n then .var (n - 1)\
      \ else .var n\n  | index, replacement, .app a b =>\n      .app (substitute index\
      \ replacement a) (substitute index replacement b)\n  | index, replacement, .lam\
      \ ty body =>\n      .lam ty (substitute (index + 1) (shift 0 1 replacement)\
      \ body)\n\ndef Target : Prop :=\n  ∀ context body argument input output,\n \
      \   HasType (input :: context) body output → HasType context argument input\
      \ →\n      HasType context (substitute 0 argument body) output\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: type-theoretic-substitution
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: typed-language-substitution
      license: Apache-2.0
      reference: null
- name: formalizer-eval/binary-search-tree-insertion
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ninductive Tree where\n\
      \  | empty : Tree\n  | node : Tree → Int → Tree → Tree\n  deriving DecidableEq\n\
      \ndef Tree.elements : Tree → List Int\n  | .empty => []\n  | .node left value\
      \ right => left.elements ++ value :: right.elements\n\ndef Tree.insert (x :\
      \ Int) : Tree → Tree\n  | .empty => .node .empty x .empty\n  | .node left value\
      \ right =>\n      if x < value then .node (left.insert x) value right\n    \
      \  else if value < x then .node left value (right.insert x)\n      else .node\
      \ left value right\n\ninductive Ordered : Tree → Prop where\n  | empty : Ordered\
      \ .empty\n  | node {left value right} : Ordered left → Ordered right →\n   \
      \   (∀ x ∈ left.elements, x < value) → (∀ x ∈ right.elements, value < x) →\n\
      \      Ordered (.node left value right)\n\ndef Target : Prop :=\n  ∀ tree x,\n\
      \    Ordered tree →\n      Ordered (tree.insert x) ∧\n      (x ∈ (tree.insert\
      \ x).elements) ∧\n      (∀ y, y ∈ (tree.insert x).elements ↔ y = x ∨ y ∈ tree.elements)\
      \ ∧\n      (tree.insert x).insert x = tree.insert x\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: ordered-search-trees
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: binary-search-tree-insertion
      license: Apache-2.0
      reference: null
- name: formalizer-eval/canonical-run-compression
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ndef prependRun {α :\
      \ Type} [DecidableEq α] (x : α) : List (α × Nat) → List (α × Nat)\n  | [] =>\
      \ [(x, 1)]\n  | (y, n) :: rest => if x = y then (y, n + 1) :: rest else (x,\
      \ 1) :: (y, n) :: rest\n\ndef compress {α : Type} [DecidableEq α] : List α →\
      \ List (α × Nat)\n  | [] => []\n  | x :: xs => prependRun x (compress xs)\n\n\
      def expand {α : Type} : List (α × Nat) → List α\n  | [] => []\n  | (x, n) ::\
      \ rest => List.replicate n x ++ expand rest\n\ndef canonical {α : Type} [DecidableEq\
      \ α] (runs : List (α × Nat)) : Prop :=\n  (∀ run ∈ runs, run.2 > 0) ∧ runs.Chain'\
      \ (fun a b => a.1 ≠ b.1)\n\ndef encodedLength {α : Type} (runs : List (α × Nat))\
      \ : Nat :=\n  (runs.map (fun run => run.2)).sum\n\ndef Target : Prop :=\n  ∀\
      \ (α : Type) [DecidableEq α] (xs : List α),\n    expand (compress xs) = xs ∧\n\
      \    canonical (compress xs) ∧\n    encodedLength (compress xs) = xs.length\
      \ ∧\n    compress (expand (compress xs)) = compress xs\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: canonical-compression
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: canonical-run-compression
      license: Apache-2.0
      reference: null
- name: formalizer-eval/group-word-reduction-correctness
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ninductive Signed (G\
      \ : Type) where\n  | positive : G → Signed G\n  | negative : G → Signed G\n\
      \  deriving DecidableEq\n\ndef Signed.flip {G : Type} : Signed G → Signed G\n\
      \  | .positive g => .negative g\n  | .negative g => .positive g\n\ndef Signed.value\
      \ {G : Type} [Group G] : Signed G → G\n  | .positive g => g\n  | .negative g\
      \ => g⁻¹\n\ndef evaluates {G : Type} [Group G] : List (Signed G) → G\n  | []\
      \ => 1\n  | x :: xs => x.value * evaluates xs\n\ndef cancelPass {G : Type} [DecidableEq\
      \ G] : List (Signed G) → List (Signed G)\n  | x :: y :: rest => if x.flip =\
      \ y then cancelPass rest else x :: cancelPass (y :: rest)\n  | word => word\n\
      \ndef normalize {G : Type} [DecidableEq G] (word : List (Signed G)) : List (Signed\
      \ G) :=\n  Nat.iterate cancelPass (word.length + 1) word\n\ndef reduced {G :\
      \ Type} [DecidableEq G] : List (Signed G) → Prop\n  | x :: y :: rest => x.flip\
      \ ≠ y ∧ reduced (y :: rest)\n  | _ => True\n\ndef Target : Prop :=\n  ∀ (G :\
      \ Type) [Group G] [DecidableEq G] (word : List (Signed G)),\n    evaluates (normalize\
      \ word) = evaluates word ∧\n    reduced (normalize word) ∧\n    cancelPass (normalize\
      \ word) = normalize word ∧\n    (normalize word).length ≤ word.length\n\nend\
      \ FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: group-word-normalization
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: group-word-reduction-correctness
      license: Apache-2.0
      reference: null
- name: formalizer-eval/expression-normalization-fixedpoint
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ninductive Expr where\n\
      \  | constant : Int → Expr\n  | variable : Nat → Expr\n  | add : Expr → Expr\
      \ → Expr\n  | multiply : Expr → Expr → Expr\n  deriving DecidableEq\n\ndef Expr.eval\
      \ (state : Nat → Int) : Expr → Int\n  | .constant z => z\n  | .variable n =>\
      \ state n\n  | .add a b => a.eval state + b.eval state\n  | .multiply a b =>\
      \ a.eval state * b.eval state\n\ndef smartAdd : Expr → Expr → Expr\n  | .constant\
      \ a, .constant b => .constant (a + b)\n  | .constant 0, b => b\n  | a, .constant\
      \ 0 => a\n  | a, b => .add a b\n\ndef smartMultiply : Expr → Expr → Expr\n \
      \ | .constant a, .constant b => .constant (a * b)\n  | .constant 0, _ | _, .constant\
      \ 0 => .constant 0\n  | .constant 1, b => b\n  | a, .constant 1 => a\n  | a,\
      \ b => .multiply a b\n\ndef Expr.normalize : Expr → Expr\n  | .constant z =>\
      \ .constant z\n  | .variable n => .variable n\n  | .add a b => smartAdd a.normalize\
      \ b.normalize\n  | .multiply a b => smartMultiply a.normalize b.normalize\n\n\
      def Expr.nodes : Expr → Nat\n  | .constant _ | .variable _ => 1\n  | .add a\
      \ b | .multiply a b => 1 + a.nodes + b.nodes\n\ndef Target : Prop :=\n  ∀ (expression\
      \ : Expr) (state : Nat → Int),\n    Expr.eval state (Expr.normalize expression)\
      \ = Expr.eval state expression ∧\n    Expr.normalize (Expr.normalize expression)\
      \ = Expr.normalize expression ∧\n    Expr.nodes (Expr.normalize expression)\
      \ ≤ Expr.nodes expression\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: canonical-expression-rewriting
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: expression-normalization-fixedpoint
      license: Apache-2.0
      reference: null
- name: formalizer-eval/stable-topk-selection-contract
  inputs:
    source: "import Mathlib\nnamespace FormalizerProblem\n\nstructure Result where\n\
      \  score : Nat\n  serial : Nat\n  deriving DecidableEq\n\ndef ahead (left right\
      \ : Result) : Bool :=\n  left.score > right.score || (left.score = right.score\
      \ && left.serial ≤ right.serial)\n\ndef ranked (results : List Result) : List\
      \ Result := results.mergeSort ahead\ndef topK (limit : Nat) (results : List\
      \ Result) : List Result := (ranked results).take limit\n\ndef Ordered (results\
      \ : List Result) : Prop := results.Pairwise fun left right => ahead left right\n\
      \ndef Target : Prop := ∀ limit results,\n  Ordered (topK limit results) ∧\n\
      \  (topK limit results).length = min limit results.length ∧\n  (∀ result ∈ topK\
      \ limit results, result ∈ results) ∧\n  (topK limit results ++ (ranked results).drop\
      \ limit = ranked results) ∧\n  topK limit results <+: topK (limit + 1) results\n\
      \nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: ranked-search-results
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: stable-topk-selection-contract
