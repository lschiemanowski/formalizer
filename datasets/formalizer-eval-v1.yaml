    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ndef bitValue (bit :\
      \ Bool) : Nat := if bit then 1 else 0\n\ndef bitsValue : List Bool → Nat\n \
      \ | [] => 0\n  | bit :: rest => bitValue bit + 2 * bitsValue rest\n\ndef fullAdder\
      \ (left right carry : Bool) : Bool × Bool :=\n  let total := bitValue left +\
      \ bitValue right + bitValue carry\n  (total % 2 = 1, total ≥ 2)\n\ndef addBits\
      \ : List Bool → List Bool → Bool → List Bool\n  | [], [], carry => if carry\
      \ then [true] else []\n  | left :: rest, [], carry =>\n      let result := fullAdder\
      \ left false carry\n      result.1 :: addBits rest [] result.2\n  | [], right\
      \ :: rest, carry =>\n      let result := fullAdder false right carry\n     \
      \ result.1 :: addBits [] rest result.2\n  | left :: leftRest, right :: rightRest,\
      \ carry =>\n      let result := fullAdder left right carry\n      result.1 ::\
      \ addBits leftRest rightRest result.2\n\ndef Target : Prop :=\n  ∀ left right\
      \ carry,\n    bitsValue (addBits left right carry) =\n      bitsValue left +\
      \ bitsValue right + bitValue carry ∧\n    (addBits left right carry).length\
