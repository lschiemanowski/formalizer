- name: formalizer-eval/quarter-turn-pose-composition
  inputs:
    source: "import Mathlib\nnamespace FormalizerProblem\n\nstructure Point where\n\
      \  x : Int\n  y : Int\n  deriving DecidableEq\n\nstructure Pose where\n  turn\
      \ : Nat\n  offset : Point\n  deriving DecidableEq\n\ndef rotate (turn : Nat)\
      \ (point : Point) : Point :=\n  match turn % 4 with\n  | 0 => point\n  | 1 =>\
      \ ⟨-point.y, point.x⟩\n  | 2 => ⟨-point.x, -point.y⟩\n  | _ => ⟨point.y, -point.x⟩\n\
      \ndef transform (pose : Pose) (point : Point) : Point :=\n  let rotated := rotate\
      \ pose.turn point\n  ⟨rotated.x + pose.offset.x, rotated.y + pose.offset.y⟩\n\
      \ndef compose (outer inner : Pose) : Pose :=\n  let shifted := rotate outer.turn\
      \ inner.offset\n  ⟨(outer.turn + inner.turn) % 4,\n   ⟨shifted.x + outer.offset.x,\
      \ shifted.y + outer.offset.y⟩⟩\n\ndef identity : Pose := ⟨0, ⟨0, 0⟩⟩\n\ndef\
      \ Target : Prop := ∀ outer inner third point,\n  transform (compose outer inner)\
      \ point = transform outer (transform inner point) ∧\n  compose identity outer\
      \ = { outer with turn := outer.turn % 4 } ∧\n  compose outer identity = { outer\
      \ with turn := outer.turn % 4 } ∧\n  compose (compose outer inner) third = compose\
      \ outer (compose inner third) ∧\n  rotate outer.turn (rotate inner.turn point)\
      \ = rotate (outer.turn + inner.turn) point\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
