      \ → Tree Value Hash → Option (Value × List (Step Hash))\n  | [], .leaf value\
      \ => some (value, [])\n  | false :: path, .node left right =>\n      (prove\
      \ hashLeaf hashNode path left).map fun result =>\n        (result.1, result.2\
      \ ++ [.siblingRight (root hashLeaf hashNode right)])\n  | true :: path, .node\
      \ left right =>\n      (prove hashLeaf hashNode path right).map fun result =>\n\
      \        (result.1, result.2 ++ [.siblingLeft (root hashLeaf hashNode left)])\n\
      \  | _, _ => none\n\ndef verify (hashLeaf : Value → Hash) (hashNode : Hash →\
      \ Hash → Hash)\n    (value : Value) (proof : List (Step Hash)) : Hash :=\n \
      \ proof.foldl (fun current step => match step with\n    | .siblingLeft sibling\
      \ => hashNode sibling current\n    | .siblingRight sibling => hashNode current\
      \ sibling) (hashLeaf value)\n\ndef Target : Prop := ∀ (Value Hash : Type) (hashLeaf\
      \ : Value → Hash)\n    (hashNode : Hash → Hash → Hash) path tree value proof,\n\
      \  (prove hashLeaf hashNode path tree = some (value, proof) →\n    verify hashLeaf\
      \ hashNode value proof = root hashLeaf hashNode tree) ∧\n  (prove hashLeaf hashNode\
      \ path tree = some (value, proof) → proof.length = path.length) ∧\n  (∀ leafValue,\
      \ prove hashLeaf hashNode [] (.leaf leafValue) = some (leafValue, [])) ∧\n \
      \ (∀ left right, prove hashLeaf hashNode [] (.node left right) = none)\n\nend\
      \ FormalizerProblem\n"
