      reference: null
- name: formalizer-eval/prefix-parser-encoder-adequacy
  inputs:
    source: "import Mathlib\n\nnamespace FormalizerProblem\n\ninductive Token where\
      \ | open | close | atom : Nat → Token deriving DecidableEq\ninductive Tree where\
      \ | atom : Nat → Tree | pair : Tree → Tree → Tree deriving DecidableEq\n\ndef\
      \ Tree.encode : Tree → List Token\n  | .atom n => [.atom n]\n  | .pair left\
      \ right => .open :: left.encode ++ right.encode ++ [.close]\n\ndef Tree.tokenCount\
      \ : Tree → Nat\n  | .atom _ => 1\n  | .pair left right => 2 + left.tokenCount\
      \ + right.tokenCount\n\ninductive ParsesOne : List Token → Tree → List Token\
      \ → Prop where\n  | atom {n suffix} : ParsesOne (.atom n :: suffix) (.atom n)\
      \ suffix\n  | pair {tokens afterLeft suffix left right} :\n      ParsesOne tokens\
      \ left afterLeft →\n      ParsesOne afterLeft right (.close :: suffix) →\n \
      \     ParsesOne (.open :: tokens) (.pair left right) suffix\n\ndef Target :\
      \ Prop :=\n  (∀ tree suffix, ParsesOne (tree.encode ++ suffix) tree suffix)\
      \ ∧\n  (∀ tokens tree suffix, ParsesOne tokens tree suffix →\n    tokens = tree.encode\
      \ ++ suffix ∧ tokens.length = tree.tokenCount + suffix.length) ∧\n  (∀ tokens\
      \ left right suffix,\n    ParsesOne tokens left suffix → ParsesOne tokens right\
      \ suffix → left = right)\n\nend FormalizerProblem\n"
  metadata:
    difficulty: hard
    split: validation
    domain: verified-prefix-codecs
    provenance:
      origin: original
      source: Formalizer DeepSeek V4 Flash clean-room benchmark
      source_id: prefix-parser-encoder-adequacy
