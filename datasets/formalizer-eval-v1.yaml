      \ nw.sample []\n  | .node nw _ _ _, .nw :: rest => nw.sample rest\n  | .node\
      \ _ ne _ _, .ne :: rest => ne.sample rest\n  | .node _ _ sw _, .sw :: rest =>\
      \ sw.sample rest\n  | .node _ _ _ se, .se :: rest => se.sample rest\n\ndef Quad.nodes\
      \ : Quad → Nat\n  | .leaf _ => 1\n  | .node nw ne sw se => 1 + nw.nodes + ne.nodes\
      \ + sw.nodes + se.nodes\n\ndef Quad.compress : Quad → Quad\n  | leaf@(.leaf\
      \ _) => leaf\n  | .node nw ne sw se =>\n      let nw' := nw.compress; let ne'\
      \ := ne.compress\n      let sw' := sw.compress; let se' := se.compress\n   \
      \   match nw', ne', sw', se' with\n      | .leaf a, .leaf b, .leaf c, .leaf\
      \ d => if a = b ∧ b = c ∧ c = d then .leaf a else .node nw' ne' sw' se'\n  \
      \    | _, _, _, _ => .node nw' ne' sw' se'\n\ndef Target : Prop := ∀ (tree :\
      \ Quad) (address : List Quadrant),\n  tree.compress.sample address = tree.sample\
