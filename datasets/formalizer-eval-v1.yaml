      \ := orders.sum\n\ndef Target : Prop := ∀ buys sells,\n  let result := clear\
      \ buys sells\n  volume buys = volume result.fills + volume result.buyRemainders\
      \ ∧\n  volume sells = volume result.fills + volume result.sellRemainders ∧\n\
      \  result.fills.length = min buys.length sells.length ∧\n  result.buyRemainders.length\
      \ = buys.length ∧\n  result.sellRemainders.length = sells.length ∧\n  (∀ fill\
      \ ∈ result.fills, fill ≤ volume buys ∧ fill ≤ volume sells)\n\nend FormalizerProblem\n"
