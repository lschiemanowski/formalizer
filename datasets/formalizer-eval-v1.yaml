      \ Type) where\n  | empty : Regex α\n  | epsilon : Regex α\n  | symbol : α →\
      \ Regex α\n  | alt : Regex α → Regex α → Regex α\n  | seq : Regex α → Regex\
      \ α → Regex α\n  | star : Regex α → Regex α\n\ninductive Matches {α : Type}\
      \ : Regex α → List α → Prop where\n  | epsilon : Matches .epsilon []\n  | symbol\
      \ (x) : Matches (.symbol x) [x]\n  | altLeft {a b w} : Matches a w → Matches\
      \ (.alt a b) w\n  | altRight {a b w} : Matches b w → Matches (.alt a b) w\n\
      \  | seq {a b u v} : Matches a u → Matches b v → Matches (.seq a b) (u ++ v)\n\
      \  | starNil {a} : Matches (.star a) []\n  | starCons {a u v} : u ≠ [] → Matches\
      \ a u → Matches (.star a) v →\n      Matches (.star a) (u ++ v)\n\ndef Regex.nullable\
      \ : Regex α → Bool\n  | .empty | .symbol _ => false\n  | .epsilon | .star _\
      \ => true\n  | .alt a b => a.nullable || b.nullable\n  | .seq a b => a.nullable\
      \ && b.nullable\n\ndef Regex.derive [DecidableEq α] (x : α) : Regex α → Regex\
      \ α\n  | .empty | .epsilon => .empty\n  | .symbol y => if x = y then .epsilon\
      \ else .empty\n  | .alt a b => .alt (a.derive x) (b.derive x)\n  | .seq a b\
      \ =>\n      if a.nullable then .alt (.seq (a.derive x) b) (b.derive x)\n   \
      \   else .seq (a.derive x) b\n  | .star a => .seq (a.derive x) (.star a)\n\n\
      def Target : Prop :=\n  ∀ (α : Type) [DecidableEq α] (regex : Regex α),\n  \
      \  (regex.nullable = true ↔ Matches regex []) ∧\n    ∀ (x : α) (word : List\
