name: formurmel-basic-problems-v1
cases:
  - name: formurmel/problem-1
    inputs:
      source: |
        import Mathlib

        namespace FormalizerProblem

        open Filter

        open scoped Pointwise

        def Target : Prop :=
          ∀ {K V : Type*} [CommRing K] [AddCommGroup V] [Module K V]
              (f : Module.End K V) (hf : IsNilpotent f),
            IsUnit (1 - f)

        end FormalizerProblem
    metadata:
      difficulty: medium
      split: validation
      domain: linear-algebra
      provenance:
        origin: adapted
        source: Formurmel basic problems dataset
        source_id: problem_1
        license: Apache-2.0
        reference: https://github.com/lschiemanowski/formurmel/blob/602d13f97a98d4e30956fc4ee3eb6dadd99dedbf/datasets/basic_problems/lean_dataset_json/validation_plus/problem_1.json

